# 부착 기하 — 터그가 폰툰에 붙는 자리 (현장에서 고치는 유일한 파일)
#
# 이 파일만 고치면 제어기·QP·플랜트·관측이 **한꺼번에** 바뀐다.
# `pontoon_rl/params/sc3.yaml` 은 학습 당시 값이므로 고치지 않는다
# (저 파일은 읽기전용으로 두고, 이 파일이 그 위에 덮어쓴다).
#
# 적용 지점: `nuc/cfg.py::load_cfg()` → `NucController` · `PontoonSc3Env`
# 설명: `docs/GEOMETRY.md`
#
# ─────────────────────────────────────────────────────────────────────
# 기준좌표계 (r1 · r2 가 "어디를 기준으로" 인가)
# ─────────────────────────────────────────────────────────────────────
#
#   원점   : 폰툰의 **기하중심** (= 균일판 가정의 질량중심)
#            Lx 2.60 m × By 2.15 m 판의 가운데
#   +x     : 선수 방향 (bow)
#   +y     : 우현 방향 (starboard)  → **좌현은 음수**
#   회전 + : 위에서 봤을 때 시계방향 (FRD, Fossen 과 동일)
#   단위   : m
#
#                      +x (선수)
#                        ▲
#          ┌─────────────┼─────────────┐
#          │             │             │
#   r1 ●───┤  좌현       ●  원점       │  우현        ─────► +y
#   r2 ●───┤           (기하중심)      │
#          │             │             │
#          └─────────────┼─────────────┘
#
#   - 터그 2 대가 **같은 좌현 변**에 붙으므로 둘 다 y < 0 이다.
#   - 값은 **터그 원점**(선체 중심)의 위치다. 전자석 패드 접촉면이 아니다.
#
# ─────────────────────────────────────────────────────────────────────
# 재는 방법
# ─────────────────────────────────────────────────────────────────────
#
#   1. 폰툰 네 변의 중점을 찍어 기하중심을 바닥에 표시한다.
#   2. 선수-선미 축(+x)을 줄자로 깔고, 그 축에 수직인 좌현 거리를 잰다.
#   3. 각 터그를 붙인 상태에서 **터그 선체 중심**까지의
#      (전후, 좌우) 거리를 읽는다. 선수쪽 = +x, 좌현 = −y.
#   4. 소수 2 자리(0.01 m)까지 적는다. 그 이상은 의미 없다
#      (`dr.r_jit` 가 ±0.15 m 를 이미 흡수한다).
#
# ─────────────────────────────────────────────────────────────────────

frame: pontoon_body_frd        # 바꾸지 않는다. 다른 값이면 load_cfg 가 거부한다

attach:
  # 터그 1 — 선수쪽
  r1: [ 0.4894, -1.08]
  # 터그 2 — 선미쪽
  r2: [-0.6106, -1.08]

  # 위 기본값의 근거 (sc3.yaml 과 동일한 값)
  #   y = -1.08 m   : 좌현 변. 반폭 By/2 = 1.075 m
  #   x 간격 1.10 m : |r1.x - r2.x| = 터그 전장 L = 1.10 m (두 대가 맞닿은 배치)
  #   x 중점 -0.0606 m : 두 터그의 중심이 기하중심보다 6 cm 선미쪽
  # ⚠️ sc3.yaml 은 이 값을 measured(y) 로 표기했으나, 같은 파일의
  #    `dr.r_jit` 주석은 "r_i 가 불확실한 것이 RL 을 쓰는 이유" 라고 적고 있다.
  #    두 표기가 상충한다 — **실측 재확인 필요**.

dr:
  # 학습 때 쓴 부착점 흔들기 폭 (±m, 균일분포). 평가는 `--dr off` 라 쓰이지 않는다.
  # 실측 불확실도가 이보다 크면 재학습이 필요하다.
  r_jit: 0.15
