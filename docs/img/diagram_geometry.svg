<rect x="620" y="44" width="464" height="133" rx="0" fill="#fbfbfb" stroke="#8c8c8c" stroke-width="1"/>
<text x="634" y="65" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="11.5" text-anchor="start" fill="#1f3a5f" font-weight="bold">재는 방법</text>
<text x="634" y="88" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal">1. 폰툰 네 변의 중점을 찍어 기하중심을 바닥에 표시</text>
<text x="634" y="107" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal">2. 선수-선미 축(+x)에 줄자를 깔고 수직 거리를 측정</text>
<text x="634" y="126" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal">3. 터그를 붙인 상태에서 터그 선체 중심까지 (전후, 좌우)</text>
<text x="634" y="145" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal">4. 소수 2 자리(0.01 m)까지. 그 이상은 의미 없음</text>
<text x="634" y="164" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="11" text-anchor="start" fill="#1f3a5f" font-weight="normal">좌현은 y 가 음수다 — 부호를 빼면 전단 방향이 뒤집힌다</text>
<rect x="620" y="196" width="464" height="136" rx="0" fill="#f4f7fb" stroke="#1f3a5f" stroke-width="1.2"/>
<text x="634" y="217" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="11.5" text-anchor="start" fill="#1f3a5f" font-weight="bold">config/geometry.yaml — 이 파일만 고친다</text>
<text x="634" y="240" font-family="Consolas, D2Coding, monospace" font-size="10.5" text-anchor="start" fill="#243447" font-weight="normal">frame: pontoon_body_frd</text>
<text x="634" y="255.5" font-family="Consolas, D2Coding, monospace" font-size="10.5" text-anchor="start" fill="#243447" font-weight="normal">attach:</text>
<text x="634" y="271" font-family="Consolas, D2Coding, monospace" font-size="10.5" text-anchor="start" fill="#243447" font-weight="normal">  r1: [ 0.4894, -1.08]   # 선수쪽</text>
<text x="634" y="286.5" font-family="Consolas, D2Coding, monospace" font-size="10.5" text-anchor="start" fill="#243447" font-weight="normal">  r2: [-0.6106, -1.08]   # 선미쪽</text>
<text x="634" y="302" font-family="Consolas, D2Coding, monospace" font-size="10.5" text-anchor="start" fill="#243447" font-weight="normal">dr:</text>
<text x="634" y="317.5" font-family="Consolas, D2Coding, monospace" font-size="10.5" text-anchor="start" fill="#243447" font-weight="normal">  r_jit: 0.15            # 측정 불확실도</text>
