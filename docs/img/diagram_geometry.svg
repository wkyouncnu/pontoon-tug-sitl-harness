<text x="664" y="432" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal">좌표축 · 회전 + 방향 (FRD)</text>
<rect x="620" y="466" width="464" height="95" rx="0" fill="#fbfbfb" stroke="#8c8c8c" stroke-width="1"/>
<text x="634" y="487" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="11.5" text-anchor="start" fill="#1f3a5f" font-weight="bold">확인 필요</text>
<text x="634" y="510" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal">r1 · r2 는 sc3.yaml 에서 터그 선체 원점으로 정의됨</text>
<text x="634" y="529" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal">전자석 패드 중심이 선체 중심에서 떨어져 있으면 보정 필요</text>
<text x="634" y="548" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal">y = -1.08 m 는 반폭 1.075 m 보다 0.005 m 바깥 — 재측정 대상</text>
