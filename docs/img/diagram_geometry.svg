<rect x="630" y="383" width="24" height="13" rx="0" fill="#e9eef5" stroke="#1f3a5f" stroke-width="1.4"/>
<text x="664" y="392" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal">폰툰 (바디좌표계 기준물체)</text>
<rect x="630" y="403" width="24" height="13" rx="0" fill="#f4f4f4" stroke="#8c8c8c" stroke-width="1" stroke-dasharray="5 3"/>
<text x="664" y="412" font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif" font-size="11" text-anchor="start" fill="#333333" font-weight="normal">터그 선체 외형 — 개략. 치수는 1.10 x 0.53 m</text>
