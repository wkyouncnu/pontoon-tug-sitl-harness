# harness_sitl/iface/schema.yaml
# ─────────────────────────────────────────────────────────────────────────────
# 폰툰 예인 RL — 가상 테스트 하네스 인터페이스 단일 정의 (single source of truth)
#
# 목적
#  - 노드 A(plant) / B(마더십 Pixhawk 바이패스) / C(NUC) / D(ESP32 링크) 가
#    같은 메시지 정의를 쓰게 한다.
#  - 실물 전환 시 **노드 본체를 고치지 않고 전송계층(transport)만 갈아끼운다.**
#  - `messages.py` 의 dataclass 는 이 파일을 그대로 반영한 것이다.
#    둘이 어긋나면 `tests/test_schema_sync.py` 가 실패한다.
#
# 근거(실물 대조) — 아래 "real" 항목은 배포된 실물 코드에서 읽은 값이다.
#  - cooperative-tug-experiment-main/experiment/nuc 코드/nuc_ws/src/
#       tug_interfaces/msg/{MothershipData,TugCommand,AllocationDebug}.msg
#       tug_bridge/mavlink/usv_tug.xml                (MAVLink custom dialect)
#       tug_bridge/tug_bridge/{tug_tx.py,mav_link.py} (UDP 송신 규약)
#       tug_allocation/config/allocation.yaml         (QoS·파라미터)
#  - 위 폴더는 읽기전용으로 취급했고 수정하지 않았다.
# ─────────────────────────────────────────────────────────────────────────────

schema_version: 1
frame_convention: "NED world / FRD body (PX4 = Fossen·SNAME 동일, 부호 반전 없음)"

# ─────────────────────────────────────────────────────────────────────────────
# 1. 메시지 정의
# ─────────────────────────────────────────────────────────────────────────────
messages:

  # ── A → B → C : 플랜트(실물=수조) 상태 ───────────────────────────────────
  PontoonState:
    role: "폰툰 결합체 상태. 실물에서는 마더십 Pixhawk 가 추정해 NUC 로 올린다."
    link: "A→B (plant→Pixhawk, 실물에서는 센서+EKF), B→C (Pixhawk→NUC)"
    rate_hz: 50
    real:
      ros2_topic: "/pontoon/state"
      ros2_type: "확인 필요 — 실물 nuc_ws 에 /pontoon/state 메시지 정의가 아직 없다.
                  BEST_PLAN §16.1 이 규약만 정했다. 본 하네스는 아래 필드로 가정한다."
      upstream_px4: # PX4 → NUC (uXRCE-DDS). 이쪽은 실물에 존재한다.
        - "/fmu/out/vehicle_local_position   (px4_msgs/msg/VehicleLocalPosition)  → x,y,vx,vy"
        - "/fmu/out/vehicle_attitude         (px4_msgs/msg/VehicleAttitude)       → q → psi"
        - "/fmu/out/vehicle_angular_velocity (px4_msgs/msg/VehicleAngularVelocity)→ r"
        - "/fmu/out/vehicle_status           (px4_msgs/msg/VehicleStatus)         → valid/arm"
    wire_dtype: float32   # ★ PX4 uORB 가 float32 다. 양자화 발생 지점.
    fields:
      - {name: t_us,  type: uint64,  unit: us,    note: "마이크로초 타임스탬프"}
      - {name: x,     type: float32, unit: m,     note: "NED North (목표 원점 기준)"}
      - {name: y,     type: float32, unit: m,     note: "NED East"}
      - {name: psi,   type: float32, unit: rad,   note: "heading, wrap(-pi,pi]"}
      - {name: u,     type: float32, unit: m/s,   note: "body surge"}
      - {name: v,     type: float32, unit: m/s,   note: "body sway"}
      - {name: r,     type: float32, unit: rad/s, note: "body yaw rate"}
      - {name: r1x,   type: float32, unit: m,     note: "터그1 부착점 x (폰툰 body). ★아래 주의 참조"}
      - {name: r1y,   type: float32, unit: m,     note: "터그1 부착점 y"}
      - {name: r2x,   type: float32, unit: m,     note: "터그2 부착점 x"}
      - {name: r2y,   type: float32, unit: m,     note: "터그2 부착점 y"}
      - {name: valid, type: uint8,   unit: "-",   note: "1=유효, 0=추정기 미수렴/arm 해제"}
    caution: |
      ★ 부착점 r1/r2 가 상태 메시지에 실려 있는 이유:
        pontoon_rl/env/pontoon_env.py 의 19차원 관측 마지막 4개가 r1(2)+r2(2) 이고,
        그 값은 플랜트가 쓰는 **지터가 적용된 실제 부착점**이다 (_sample_world 참조).
        즉 학습된 정책은 "부착점을 정확히 안다"는 전제로 돌아간다.
        실물에서는 이 값이 측정값이 아니라 **설치 도면값/추정값**이므로,
        이 경로는 하네스에서는 충실 재현을 위해 그대로 두되 **한계로 명시한다 (확인 필요).**

  # ── mission → C : 목표 자세 ──────────────────────────────────────────────
  PontoonGoal:
    role: "정밀 정렬 목표. 시나리오 3 은 고정 목표(원점)."
    link: "C 내부 (mission_node → rl_node)"
    rate_hz: 1
    real:
      ros2_topic: "/pontoon/goal"
      ros2_type: "확인 필요 — 실물 메시지 정의 미존재. BEST_PLAN §16.1 규약만 있음."
    wire_dtype: float32
    fields:
      - {name: t_us,     type: uint64,  unit: us}
      - {name: gx,       type: float32, unit: m}
      - {name: gy,       type: float32, unit: m}
      - {name: gpsi,     type: float32, unit: rad}
      - {name: scenario, type: uint8,   unit: "-", note: "3 = 도킹 정밀정렬"}

  # ── C 내부 : RL 정책 출력 (상위 희망 합력) ──────────────────────────────
  MothershipData:
    role: "RL 정책이 내는 폰툰 몸체 희망 합력 τ_d = [X, Y, N]."
    link: "C 내부 (rl_node → latch_qp_node)"
    rate_hz: 10        # ★ 정책 10 Hz. 하위는 50 Hz 이므로 sample-and-hold 발생.
    real:
      ros2_topic: "/mothership_data"
      ros2_type: "tug_interfaces/msg/MothershipData"   # ★ 실물에 존재 (확정)
      mavlink:
        msg: MOTHERSHIP_DATA
        id: 52502
        crc_extra: 123
        payload: "<Qfff"   # uint64 + 3 x float32  (20 B)
        note: "usv_tug.xml 기준. float32 → 양자화 있음. 단 하네스 폐루프에는 쓰이지 않는다
               (NUC 내부 신호이므로 inproc). 실물 로깅/모니터 경로에서만 쓰인다."
    wire_dtype: float64
    fields:
      - {name: t_us,  type: uint64,  unit: us}
      - {name: tau_x, type: float64, unit: N,   note: "surge, 선수 +"}
      - {name: tau_y, type: float64, unit: N,   note: "sway, 우현 +"}
      - {name: tau_n, type: float64, unit: N.m, note: "yaw, 위에서 봤을 때 시계방향 +"}

  # ── C → D : 터그별 희망 힘 (Latch-aware QP 출력) ────────────────────────
  TugCommand:
    role: "Latch-aware QP 가 배분한 터그별 합력 [τ1; τ2]."
    link: "C→D (NUC→ESP32). ★ 실물 전송 포맷을 하네스가 그대로 쓴다."
    rate_hz: 50
    real:
      ros2_topic: "/tug_command"
      ros2_type: "tug_interfaces/msg/TugCommand"        # ★ 실물에 존재 (확정)
      mavlink:
        msg: TUG_COMMAND
        id: 52503
        crc_extra: 16
        payload: "<Qdddddd"   # uint64 + 6 x float64  (56 B)
        transport: "UDP, pymavlink mavutil, own_sysid 250 / own_compid 191, send_rate_hz 50"
        note: "float64 이므로 ★이 경로에는 양자화 손실이 없다. 터그1은 *_one, 터그2는 *_two 를 쓴다."
    wire_dtype: float64
    fields:
      - {name: t_us,      type: uint64,  unit: us}
      - {name: tau_x_one, type: float64, unit: N}
      - {name: tau_y_one, type: float64, unit: N}
      - {name: tau_n_one, type: float64, unit: N.m}
      - {name: tau_x_two, type: float64, unit: N}
      - {name: tau_y_two, type: float64, unit: N}
      - {name: tau_n_two, type: float64, unit: N.m}

  # ── C → 로그 : QP 진단 ──────────────────────────────────────────────────
  AllocationDebug:
    role: "QP 포화/latch 여유 진단. 제약이 아니라 로그 전용."
    link: "C → 로거"
    rate_hz: 50
    real:
      ros2_topic: "/allocation_debug"
      ros2_type: "tug_interfaces/msg/AllocationDebug"   # ★ 실물에 존재 (확정)
    wire_dtype: float64
    fields:
      - {name: t_us,         type: uint64}
      - {name: tau_x,        type: float64, note: "요청"}
      - {name: tau_y,        type: float64}
      - {name: tau_n,        type: float64}
      - {name: tau_real_x,   type: float64, note: "실현 A@u"}
      - {name: tau_real_y,   type: float64}
      - {name: tau_real_n,   type: float64}
      - {name: error_x,      type: float64, note: "실현 - 요청 (= env 의 res)"}
      - {name: error_y,      type: float64}
      - {name: error_n,      type: float64}
      - {name: ok,           type: uint8}
      - {name: saturated,    type: uint8}
      - {name: solve_time_us,type: float64}
      - {name: marg_one,     type: float64, note: "터그1 latch 여유 (최소 정규화 여유)"}
      - {name: marg_two,     type: float64}

  # ── D → A : 터그 추진기 실제 발생 힘 ────────────────────────────────────
  TugThrust:
    role: "터그 하위 역배분 B_F^-1 을 거친 추진기 3기 힘과, 그로부터 재구성된 터그 합력.
           실물에서는 터그 Pixhawk 내부 신호이고 플랜트(물)에 작용하는 것은 이 값이다."
    link: "D→A"
    rate_hz: 50
    real:
      ros2_topic: "없음 (터그 Pixhawk 내부). 확인 필요 — 터그 측 로깅은 ULog 로만 남는다."
    wire_dtype: float64
    fields:
      - {name: t_us,  type: uint64}
      - {name: f_one, type: "float64[3]", unit: N, note: "터그1 추진기 [좌, 우, 바우]"}
      - {name: f_two, type: "float64[3]", unit: N}
      - {name: tau_one, type: "float64[3]", note: "B_F @ f_one (포화·양자화 후 실제 합력)"}
      - {name: tau_two, type: "float64[3]"}

  # ── mode flag (실물 전용, 하네스에서는 통과) ────────────────────────────
  MothershipMode:
    role: "MANUAL / RL 전환. 안전장치. 하네스에서는 항상 RL."
    link: "NUC → 마더십 Pixhawk"
    rate_hz: "event"
    real:
      ros2_topic: "/fmu/in/mothership_mode"
      ros2_type: "확인 필요 — 커스텀 uORB 토픽. BEST_PLAN §5.2 가 전례
                  (example_four_publisher.py + px4_ros2_communication_example.slx) 를 제시."
    fields:
      - {name: t_us, type: uint64}
      - {name: mode, type: uint8, note: "0=MANUAL, 1=RL"}

# ─────────────────────────────────────────────────────────────────────────────
# 2. 전송계층 (transport)
# ─────────────────────────────────────────────────────────────────────────────
transports:

  inproc:
    status: "구현 완료 (기본값)"
    impl: "harness_sitl/iface/transport.py :: InprocTransport"
    note: |
      파이썬 queue 기반. 지연/드랍/양자화를 주입할 수 있다 (기본 0).
      CI 가능하고 빠르다. 결정론적이다 (시간이 아니라 틱 수로 지연을 센다).

  ros2:
    status: "★ 스텁 — 이 PC 에 ROS 2 가 없다 (확인 필요)"
    impl: "harness_sitl/iface/ros2_stub.py :: Ros2Transport"
    note: |
      인터페이스는 InprocTransport 와 동일하다. rclpy 가 import 되면 실제 pub/sub 을
      만들고, 안 되면 명확한 에러를 낸다. 노드 본체는 전혀 고치지 않는다.
    qos:   # 실물 allocation.yaml / BEST_PLAN §4.3 기준
      "/fmu/out/*":      {reliability: BEST_EFFORT, durability: VOLATILE,        history: "KEEP_LAST(1)"}
      "/fmu/in/*":       {reliability: BEST_EFFORT, durability: TRANSIENT_LOCAL, history: "KEEP_LAST(1)"}
      "/pontoon/state":  {reliability: RELIABLE,    durability: VOLATILE,        history: "KEEP_LAST(1)"}
      "/pontoon/goal":   {reliability: RELIABLE,    durability: VOLATILE,        history: "KEEP_LAST(1)"}
      "/mothership_data": {reliability: BEST_EFFORT, durability: VOLATILE,        history: "KEEP_LAST(1)"}
      "/tug_command":    {reliability: BEST_EFFORT, durability: VOLATILE,        history: "KEEP_LAST(1)"}
      "/allocation_debug": {reliability: BEST_EFFORT, durability: VOLATILE,        history: "KEEP_LAST(1)"}
    watchdog:
      cmd_timeout_sec: 1.5   # BEST_PLAN §4.3 safety_node
      input_timeout_s: 0.5   # tug_tx.py 실측 파라미터
      shutdown_zero_count: 10

  mavlink_udp:
    status: "프레이밍 구현 완료 (pymavlink 미설치 → 직접 구현)"
    impl: "harness_sitl/iface/mavlink_wire.py"
    note: |
      pymavlink 이 plan_pontoon_rl/.venv 에 없다. 실물 생성 다이얼렉트
      (tug_bridge/mavlink_dialect/usv_tug.py) 는 읽기전용 폴더에 있고 pymavlink 의존이다.
      따라서 MAVLink v2 프레이밍(CRC-16/MCRF4XX + crc_extra)을 직접 구현하고,
      crc_extra 상수(MOTHERSHIP_DATA=123, TUG_COMMAND=16)만 그 파일에서 인용했다.
      tests/test_wire_roundtrip.py 가 왕복 일치를 검증한다.

# ─────────────────────────────────────────────────────────────────────────────
# 3. 레이트 / 지연 예산
# ─────────────────────────────────────────────────────────────────────────────
rates:
  physics_hz: 50      # 플랜트 적분 (pontoon_env n_sub=5, dt_ctrl=0.1 → h=0.02)
  state_pub_hz: 50    # B → C
  policy_hz: 10       # ★ C 의 RL 추론. env 의 dt_ctrl=0.1 과 일치
  qp_hz: 50           # C 의 QP. τ_d 는 ZOH 되므로 결과는 10 Hz 와 동일
  tug_tx_hz: 50       # C → D
latency_budget_ms:    # BEST_PLAN §9. ★ 전부 확인 필요 (실측 아님)
  px4_to_nuc: "1~3"
  onnx_infer: "<0.1"
  qp_solve: "0.1~0.5"
  nuc_to_esp32_to_tug_px4: "10~50 (Wi-Fi MAVLink, 분산 큼 — 지배항)"
  total: "15~55"
